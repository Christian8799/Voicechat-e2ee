name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (e.g. v1.4.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          RELEASE_TYPE="release"
          if [[ "$VERSION" == *-* ]]; then RELEASE_TYPE="beta"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_type=$RELEASE_TYPE" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Build release JAR and run self-tests
        run: bash ./gradlew clean assemble selfTest -Pmod_version="${{ steps.tag.outputs.version }}"

      - name: Verify release JAR
        id: jar
        shell: bash
        run: |
          JAR="build/libs/voicechat-e2ee-${{ steps.tag.outputs.version }}.jar"
          if [[ ! -f "$JAR" ]]; then
            echo "Expected release JAR missing: $JAR" >&2
            ls -la build/libs >&2 || true
            exit 1
          fi
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Voice Chat E2EE ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.jar.outputs.path }}
          fail_on_unmatched_files: true

      - name: Upload to CurseForge
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_TYPE: ${{ steps.tag.outputs.release_type }}
          JAR: ${{ steps.jar.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CURSEFORGE_API_TOKEN:-}" ]]; then
            echo "Missing secret CURSEFORGE_API_TOKEN" >&2
            exit 1
          fi

          CHANGELOG="$(gh release view "$TAG" --json body --jq '.body')"
          if [[ -z "$CHANGELOG" ]]; then
            echo "Release notes are empty; aborting CurseForge upload." >&2
            exit 1
          fi

          # CurseForge expects game-version IDs, not arbitrary labels.
          VERSIONS_JSON="$(curl --fail-with-body --silent --show-error \
            -H "X-Api-Token: $CURSEFORGE_API_TOKEN" \
            "https://minecraft.curseforge.com/api/game/versions")"
          GAME_VERSION_IDS="$(printf '%s' "$VERSIONS_JSON" | jq -cer '
            def findid($name): [.[] | select(.name == $name) | .id] | unique;
            {
              mc: findid("26.3"),
              fabric: findid("Fabric"),
              client: findid("Client")
            }
            | select((.mc|length)==1 and (.fabric|length)==1 and (.client|length)==1)
            | [.mc[0], .fabric[0], .client[0]]
          ')" || {
            echo "Could not resolve required CurseForge game-version IDs." >&2
            exit 1
          }

          METADATA="$(jq -n \
            --arg displayName "Voice Chat E2EE $TAG" \
            --arg changelog "$CHANGELOG" \
            --arg releaseType "$RELEASE_TYPE" \
            --argjson gameVersions "$GAME_VERSION_IDS" \
            '{
              displayName: $displayName,
              changelog: $changelog,
              changelogType: "markdown",
              releaseType: $releaseType,
              gameVersions: $gameVersions
            }')"

          RESPONSE="$(curl --fail-with-body --silent --show-error \
            -H "X-Api-Token: $CURSEFORGE_API_TOKEN" \
            -F "metadata=$METADATA" \
            -F "file=@$JAR;type=application/java-archive" \
            "https://minecraft.curseforge.com/api/projects/1813317/upload-file")"
          FILE_ID="$(printf '%s' "$RESPONSE" | jq -er '.id')"
          echo "CurseForge upload successful. File ID: $FILE_ID"
