name: Java CI with Gradle

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Build and run self-tests with Gradle Wrapper
        run: bash ./gradlew assemble selfTest

      - name: Find release JAR
        if: startsWith(github.ref, 'refs/tags/v')
        id: jar
        shell: bash
        run: |
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)"
          if [ -z "$JAR" ]; then
            echo "No release JAR found in build/libs" >&2
            exit 1
          fi
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and attach JAR
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          JAR: ${{ steps.jar.outputs.path }}
        run: gh release create "$TAG" "$JAR" --title "$TAG" --generate-notes

      - name: Upload to CurseForge
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          TAG: ${{ github.ref_name }}
          JAR: ${{ steps.jar.outputs.path }}
        shell: bash
        run: |
          if [ -z "$CURSEFORGE_API_TOKEN" ]; then
            echo "Missing GitHub Actions secret CURSEFORGE_API_TOKEN" >&2
            exit 1
          fi

          CHANGELOG="$(gh release view "$TAG" --json body --jq .body)"
          METADATA="$(jq -n \
            --arg name "Voice Chat E2EE $TAG" \
            --arg changelog "$CHANGELOG" \
            '{displayName: $name, changelog: $changelog, changelogType: "markdown", releaseType: "release", gameVersionNames: ["26.3", "Fabric", "Client"]}')"

          curl --fail-with-body --silent --show-error \
            -H "X-Api-Token: $CURSEFORGE_API_TOKEN" \
            -F "metadata=$METADATA" \
            -F "file=@$JAR;type=application/java-archive" \
            "https://minecraft.curseforge.com/api/projects/1813317/upload-file"
