plugins {
    // Same Loom plugin as Simple Voice Chat uses for 26.x (Minecraft is no longer obfuscated as of 26.1)
    id 'net.fabricmc.fabric-loom' version '1.19.4'
}

version = project.mod_version
group = 'voicechate2ee'

base {
    archivesName = 'voicechat-e2ee'
}

repositories {
    maven { url = 'https://libraries.minecraft.net' }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Simple Voice Chat (not bundled, only used for compiling and for ./gradlew runClient)
    implementation "${project.voicechat_dependency}"

    // Optional integration: compile against Mod Menu without requiring it at runtime.
    modCompileOnly "maven.modrinth:modmenu:18.0.2"
}

processResources {
    inputs.property 'mod_version', project.mod_version
    filesMatching('fabric.mod.json') {
        expand 'mod_version': project.mod_version,
                'fabric_loader_version': project.fabric_loader_version,
                'minecraft_dependency': project.minecraft_dependency,
                'java_version': project.java_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = project.java_version as int
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
}

// The project uses a lightweight self-test harness instead of JUnit.
tasks.register('selfTest', JavaExec) {
    group = 'verification'
    description = 'Runs the project self-tests, including whitelist cryptography and audio-path checks.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'voicechate2ee.SelfTest'
}
